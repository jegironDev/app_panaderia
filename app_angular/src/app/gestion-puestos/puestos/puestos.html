<app-barra-navegacion></app-barra-navegacion><main class="container py-4"><div class="d-flex justify-content-between align-items-center mb-3"><h1>Gestión de puestos</h1><button class="btn btn-primary" type="button" (click)="nuevo()">Nuevo puesto</button></div><div *ngIf="error" class="alert alert-danger">{{error}}</div><div *ngIf="exito" class="alert alert-success">{{exito}}</div><div class="row g-4"><section class="col-lg-7"><div class="card shadow-sm"><div class="table-responsive"><table class="table mb-0"><thead><tr><th>Puesto</th><th>Estado</th><th>Usuarios</th><th></th></tr></thead><tbody><tr *ngFor="let puesto of puestos"><td><strong>{{puesto.NOMBRE}}</strong><br><small>{{puesto.DESCRIPCION}}</small></td><td>{{puesto.ESTADO==='A'?'Activo':'Inactivo'}}</td><td>{{puesto.USUARIOS_ACTIVOS||0}}</td><td class="text-nowrap"><button class="btn btn-sm btn-outline-primary me-2" (click)="editar(puesto)">Editar</button><button class="btn btn-sm btn-outline-secondary" (click)="cambiarEstado(puesto)">{{puesto.ESTADO==='A'?'Desactivar':'Activar'}}</button></td></tr></tbody></table></div></div></section><section class="col-lg-5"><div class="card shadow-sm"><div class="card-body"><h2 class="h4">{{actual?'Editar puesto':'Nuevo puesto'}}</h2><div class="mb-3"><label class="form-label">Nombre</label><input class="form-control" [(ngModel)]="nombre"></div><div class="mb-3"><label class="form-label">Descripción</label><textarea class="form-control" [(ngModel)]="descripcion"></textarea></div><p class="fw-semibold">Permisos</p><div class="form-check" *ngFor="let permiso of permisos"><input class="form-check-input" type="checkbox" [id]="'p'+permiso.ID_PERMISO" [checked]="seleccion.includes(permiso.ID_PERMISO)" (change)="alternar(permiso.ID_PERMISO,$any($event.target).checked)"><label class="form-check-label" [for]="'p'+permiso.ID_PERMISO">{{permiso.CODIGO}}</label></div><button class="btn btn-primary mt-3" type="button" [disabled]="cargando" (click)="guardar()">{{cargando?'Guardando...':'Guardar'}}</button></div></div></section></div></main>
