<main class="container py-5">
  <h1 class="mb-4">Panadería San Carlos</h1>
  <form class="card p-4 shadow-sm" (ngSubmit)="ingresar()">
    <div class="mb-3">
      <label class="form-label">Usuario</label>
      <input class="form-control" name="usuario" [(ngModel)]="usuario" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Contraseña</label>
      <input class="form-control" type="password" name="contrasena" [(ngModel)]="contrasena" required>
    </div>
    <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
    <button type="submit" class="btn btn-primary w-100">Ingresar</button>
  </form>
</main>
