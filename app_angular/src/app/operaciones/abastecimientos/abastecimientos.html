<app-barra-navegacion></app-barra-navegacion><main class="container py-4"><h1>Abastecimiento e inventario</h1><div class="card shadow-sm mb-4"><div class="card-body"><h2 class="h5">Registrar ingreso</h2><div class="row g-2"><div class="col-md-6"><select class="form-select" [(ngModel)]="identificadorProducto"><option [ngValue]="null">Seleccione un producto</option><option *ngFor="let p of productos" [ngValue]="p.ID_PRODUCTO">{{p.NOMBRE}} ({{p.ABREVIATURA}})</option></select></div><div class="col-md-3"><input class="form-control" type="number" min="0.01" step="0.01" [(ngModel)]="cantidad" placeholder="Cantidad"></div><div class="col-md-3"><button type="button" class="btn btn-success w-100" [disabled]="procesando" (click)="guardar()">{{procesando?'Registrando...':'Registrar ingreso'}}</button></div></div><div *ngIf="mensaje" class="alert alert-success mt-3 mb-0">{{mensaje}}</div><div *ngIf="error" class="alert alert-danger mt-3 mb-0">{{error}}</div></div></div><h2 class="h4">Historial</h2><div class="table-responsive"><table class="table"><thead><tr><th>Fecha</th><th>Producto</th><th>Anterior</th><th>Nueva</th><th>Responsable</th></tr></thead><tbody><tr *ngFor="let r of registros"><td>{{r.FECHA}}</td><td>{{r.PRODUCTO}}</td><td>{{r.EXISTENCIA_ANTERIOR}}</td><td>{{r.EXISTENCIA_NUEVA}}</td><td>{{r.RESPONSABLE}}</td></tr><tr *ngIf="!registros.length"><td colspan="5" class="text-muted">No hay ingresos registrados.</td></tr></tbody></table></div></main>
