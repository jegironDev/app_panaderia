<app-barra-navegacion></app-barra-navegacion><main class="container py-4"><h1>Administración de cancelaciones</h1><div *ngIf="mensaje" class="alert alert-success">{{mensaje}}</div><div *ngIf="error" class="alert alert-danger">{{error}}</div><div class="table-responsive"><table class="table"><thead><tr><th>Pedido</th><th>Sucursal</th><th>Solicitante</th><th>Motivo</th><th>Estado</th><th>Acciones</th></tr></thead><tbody><tr *ngFor="let s of solicitudes"><td>#{{s.ID_PEDIDO}}</td><td>{{s.ID_SUCURSAL}}</td><td>{{s.SOLICITANTE}}</td><td>{{s.MOTIVO}}</td><td>{{s.ESTADO}}</td><td *ngIf="s.ESTADO==='PENDIENTE'"><input class="form-control form-control-sm mb-1" [(ngModel)]="motivos[s.ID_SOLICITUD]" placeholder="Motivo si rechaza"><button class="btn btn-sm btn-success me-1" (click)="resolver(s,'APROBAR')">Autorizar</button><button class="btn btn-sm btn-danger" (click)="resolver(s,'RECHAZAR')">Rechazar</button></td></tr><tr *ngIf="!solicitudes.length"><td colspan="6" class="text-muted">No hay solicitudes.</td></tr></tbody></table></div></main>
