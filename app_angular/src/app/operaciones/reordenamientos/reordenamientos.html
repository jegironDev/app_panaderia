<app-barra-navegacion></app-barra-navegacion><main class="container py-4"><h1>Solicitudes de cambio de posición</h1><div *ngIf="mensaje" class="alert alert-success">{{mensaje}}</div><div *ngIf="error" class="alert alert-danger">{{error}}</div><div class="table-responsive"><table class="table"><thead><tr><th>Piloto</th><th>Ruta</th><th>Pedido</th><th>Posición actual</th><th>Posición solicitada</th><th>Justificación</th><th>Estado</th><th></th></tr></thead><tbody><tr *ngFor="let s of solicitudes"><td>{{s.PILOTO}}</td><td>{{s.RUTA}}</td><td>#{{s.ID_PEDIDO}}</td><td>{{s.POSICION_ORIGEN}}</td><td>{{s.POSICION_SOLICITADA}}</td><td>{{s.JUSTIFICACION}}</td><td><span class="badge" [class.text-bg-warning]="s.ESTADO==='PENDIENTE'" [class.text-bg-success]="s.ESTADO==='AUTORIZADA'" [class.text-bg-danger]="s.ESTADO==='RECHAZADA'">{{s.ESTADO}}</span></td><td *ngIf="s.ESTADO==='PENDIENTE'"><input class="form-control form-control-sm mb-1" [(ngModel)]="motivos[s.ID_SOLICITUD_REORDENAMIENTO]" placeholder="Motivo para rechazo"><button class="btn btn-sm btn-success me-1" (click)="resolver(s,'AUTORIZAR')">Autorizar</button><button class="btn btn-sm btn-danger" (click)="resolver(s,'RECHAZAR')">Rechazar</button></td></tr></tbody></table></div></main>
