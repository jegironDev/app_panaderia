<app-barra-navegacion></app-barra-navegacion><main class="container py-4"><h1>Materias primas e insumos</h1><div *ngIf="mensaje" class="alert alert-success">{{mensaje}}</div><div *ngIf="error" class="alert alert-danger">{{error}}</div><div class="row g-4"><section class="col-lg-7"><div class="table-responsive card shadow-sm"><table class="table align-middle mb-0"><thead><tr><th>Producto</th><th>Unidad</th><th>Estado</th><th>Acciones</th></tr></thead><tbody><tr *ngFor="let producto of productos"><td>{{producto.NOMBRE}}</td><td>{{producto.ABREVIATURA}}</td><td><span class="badge" [class.text-bg-success]="producto.ESTADO==='A'" [class.text-bg-secondary]="producto.ESTADO!=='A'">{{producto.ESTADO==='A'?'Activo':'Inactivo'}}</span></td><td><div class="d-grid gap-1"><button class="btn btn-sm btn-primary" type="button" (click)="editar(producto)">Editar</button><button class="btn btn-sm" [class.btn-danger]="producto.ESTADO==='A'" [class.btn-success]="producto.ESTADO!=='A'" type="button" (click)="cambiarEstado(producto)">{{producto.ESTADO==='A'?'Desactivar':'Activar'}}</button></div></td></tr><tr *ngIf="!productos.length"><td colspan="4" class="text-muted">No hay materias primas ni insumos.</td></tr></tbody></table></div></section><aside class="col-lg-5"><div class="card shadow-sm"><div class="card-body"><h2 class="h5">{{actual?'Editar producto':'Crear producto'}}</h2><div class="mb-2"><label class="form-label">Nombre *</label><input class="form-control" [(ngModel)]="nombre"></div><div class="mb-2" *ngIf="!actual"><label class="form-label">Clasificación</label><select class="form-select" [(ngModel)]="tipo"><option value="MAT">Materia prima</option><option value="INS">Insumo</option></select></div><div class="mb-3" *ngIf="!actual"><label class="form-label">Unidad de medida *</label><select class="form-select" [(ngModel)]="identificadorUnidadMedida"><option [ngValue]="null">Seleccione una unidad</option><option *ngFor="let unidad of unidades" [ngValue]="unidad.ID_UNIDAD_MEDIDA">{{unidad.NOMBRE}} ({{unidad.ABREVIATURA}})</option></select></div><button class="btn btn-success" [disabled]="procesando" type="button" (click)="guardar()">Guardar</button><button class="btn btn-secondary ms-2" type="button" (click)="nuevo()">Cancelar</button></div></div></aside></div></main>
